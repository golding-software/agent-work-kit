# Threads settled: a required check that passes when every open, non-outdated review thread on the PR is resolved, or ends in the shared PR review's settled reply (<!-- pr-review:fixed sha=… -->) for the head commit or for an earlier
# commit when the review has recorded the head as reviewed since. Use it in place of the branch rule "require
# conversation resolution", which counts those replies as open. On a pull_request event it first waits for the PR
# review run on the same commit, because the review's own replies do not start workflows.
#
# GENERATED by scripts/build.py from ci/threads-settled.yml.in and ci/threads_settled.py. Edit those, then rebuild.
#
# Call it from a small caller (plugins/pr-review/skills/setup-pr-review/templates/threads-settled.yml); the required
# check is then "threads-settled / check".
name: Threads settled

on:
  workflow_call:
    inputs:
      review-workflow:
        description: The name of the PR review workflow to wait for on the same commit ("" = do not wait)
        type: string
        default: PR review
      wait-minutes:
        description: How long to wait for that review run before failing (it never passes while the review runs)
        type: number
        default: 20

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: read
      actions: read
    steps:
      - name: Every open review thread is resolved or settled
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_WORKFLOW: ${{ inputs.review-workflow }}
          WAIT_MINUTES: ${{ inputs.wait-minutes }}
        run: |
          cat > "$RUNNER_TEMP/threads_settled.py" <<'TS_EOF'
          """Threads settled: the required check that every open review thread on a pull request is resolved or settled.

          A thread is settled when its last comment is the shared PR review's settled reply, written by a bot
          (<!-- pr-review:fixed sha=... -->) for the head commit, or for an earlier commit when the review has since
          recorded the head as reviewed (<!-- pr-review:state sha=... -->). The workflow token cannot resolve threads, so
          the review replies on the thread instead; a later reply by anyone reopens it.

          Pure functions (the tests call these): is_bot, reviewed_sha, judge, evaluate, settled_count, pending_runs.
          Network (urllib, standard library only): fetch_threads, fetch_issue_comments, wait_for_review.
          The CLI exits 0 when every open thread is settled, 1 when one is not (or the review is still running), and
          2 on any error, so an error never passes.
          """
          import argparse, json, os, re, sys, time, urllib.error, urllib.request
          from pathlib import Path

          BOT_RE = re.compile(r"(claude|github-actions)(\[bot\])?")
          FIXED_RE = re.compile(r"<!-- pr-review:fixed sha=([0-9a-f]{40}) -->")
          STATE_RE = re.compile(r"<!-- pr-review:state sha=([0-9a-f]{40}) -->")
          POLL_SECONDS = 20
          APPEAR_SECONDS = 180   # how long to wait for the review's run to be registered on the commit

          QUERY = """query($o: String!, $r: String!, $n: Int!, $c: String) {
            repository(owner: $o, name: $r) {
              pullRequest(number: $n) {
                reviewThreads(first: 100, after: $c) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isResolved isOutdated path
                    opening: comments(first: 1) { nodes { url author { login } } }
                    last: comments(last: 1) { nodes { url body author { login } } }
                  }
                }
              }
            }
          }"""


          def is_bot(login):
              """True for the review's bot logins: GraphQL says github-actions, REST says github-actions[bot]."""
              return login is not None and BOT_RE.fullmatch(login) is not None


          def reviewed_sha(issue_comments):
              """The sha in the last state marker written by a bot (REST issue comments), or None."""
              sha = None
              for c in issue_comments:
                  login = ((c.get("user") or {}).get("login"))
                  m = STATE_RE.search(c.get("body") or "")
                  if m and is_bot(login):
                      sha = m.group(1)
              return sha


          def _login(node):
              """The author's login; None for a deleted user (a null author)."""
              author = (node or {}).get("author")
              return None if author is None else author.get("login")


          def judge(thread, head_sha, reviewed):
              """(state, url, reason) for one thread: state is 'resolved', 'outdated', 'settled' or 'unsettled'."""
              opening = ((thread.get("opening") or {}).get("nodes") or [None])[0]
              last_nodes = (thread.get("last") or {}).get("nodes") or []
              last = last_nodes[-1] if last_nodes else None
              url = (opening or {}).get("url") or (last or {}).get("url")
              if thread.get("isResolved"):
                  return "resolved", url, ""
              if thread.get("isOutdated"):
                  return "outdated", url, ""
              if last is None:
                  return "unsettled", url, "the thread has no comments"
              login = _login(last)
              if not is_bot(login):
                  return "unsettled", url, f"last comment is from {login if login is not None else 'a deleted user'}"
              m = FIXED_RE.search(last.get("body") or "")
              if not m:
                  return "unsettled", url, "the bot's last comment is not a settled reply"
              marker = m.group(1)
              if marker == head_sha or reviewed == head_sha:
                  return "settled", url, ""
              return "unsettled", url, (f"settled at {marker[:7]}, but the head {head_sha[:7]} "
                                        "has not been reviewed since")


          def evaluate(threads, head_sha, reviewed):
              """(url, reason) for every open, non-outdated thread that is not settled."""
              return [(url, reason) for state, url, reason in (judge(t, head_sha, reviewed) for t in threads)
                      if state == "unsettled"]


          def settled_count(threads, head_sha, reviewed):
              """How many open threads end in the review's settled reply."""
              return sum(1 for t in threads if judge(t, head_sha, reviewed)[0] == "settled")


          def pending_runs(runs, workflow_name, own_run_id):
              """The runs of the named workflow, other than this run, that have not completed."""
              return [r for r in runs
                      if r.get("name") == workflow_name
                      and str(r.get("id")) != str(own_run_id or "")
                      and r.get("status") != "completed"]


          # ---- network (GitHub REST and GraphQL) -------------------------------------------------------------------------

          def _api_base():
              return os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")


          def _send(url, body=None):
              token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
              if not token:
                  raise RuntimeError("no token: set GH_TOKEN or GITHUB_TOKEN")
              headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method="POST" if data is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return json.loads(resp.read().decode() or "null")
              except urllib.error.HTTPError as e:
                  detail = e.read().decode(errors="replace")[:300]
                  raise RuntimeError(f"GitHub returned {e.code} for {url}: {detail}") from None


          def fetch_threads(repo, pr):
              """Every review thread of the pull request (GraphQL, paged)."""
              owner, name = repo.split("/", 1)
              url = os.environ.get("GITHUB_GRAPHQL_URL") or _api_base() + "/graphql"
              threads, cursor = [], None
              while True:
                  resp = _send(url, {"query": QUERY, "variables": {"o": owner, "r": name, "n": int(pr), "c": cursor}})
                  if resp.get("errors"):
                      raise RuntimeError(f"GraphQL error: {resp['errors']}")
                  pr_node = ((resp.get("data") or {}).get("repository") or {}).get("pullRequest")
                  if pr_node is None:
                      raise RuntimeError(f"no pull request #{pr} in {repo}")
                  conn = pr_node["reviewThreads"]
                  threads += conn["nodes"]
                  if not conn["pageInfo"]["hasNextPage"]:
                      return threads
                  cursor = conn["pageInfo"]["endCursor"]
                  if not cursor:
                      raise RuntimeError("GraphQL paging: no end cursor")


          def fetch_issue_comments(repo, pr):
              """Every issue comment on the pull request (REST), until a page comes back short."""
              out, page = [], 1
              while True:
                  batch = _send(f"{_api_base()}/repos/{repo}/issues/{pr}/comments?per_page=100&page={page}")
                  out += batch
                  if len(batch) < 100:
                      return out
                  page += 1


          def fetch_runs(repo, head):
              data = _send(f"{_api_base()}/repos/{repo}/actions/runs?head_sha={head}&per_page=100")
              return data.get("workflow_runs", [])


          def wait_for_review(repo, head, workflow_name, own_run_id, minutes):
              """True when the review workflow has a run on this commit and none of its runs is pending; False at the deadline.

              The same push starts this check and the review, and the review's run can be registered a little later: until
              one appears, keep waiting (up to APPEAR_SECONDS), so the check never reads the threads before the review ran.
              A repository whose review does not run on this commit is checked as it is once APPEAR_SECONDS have passed."""
              if not workflow_name:
                  return True
              start = time.monotonic()
              deadline = start + float(minutes) * 60
              while True:
                  runs = fetch_runs(repo, head)
                  seen = [r for r in runs if r.get("name") == workflow_name and str(r.get("id")) != str(own_run_id or "")]
                  pending = pending_runs(runs, workflow_name, own_run_id)
                  if seen and not pending:
                      return True
                  if not seen:
                      if time.monotonic() - start >= APPEAR_SECONDS:
                          print(f"no {workflow_name!r} run on this commit after {APPEAR_SECONDS}s; checking the threads as they are",
                                flush=True)
                          return True
                      print(f"waiting for a {workflow_name!r} run to start on this commit", flush=True)
                  else:
                      waiting = ", ".join(f"#{r.get('id')} {r.get('name')} ({r.get('status')})" for r in pending)
                      print(f"waiting for the review run: {waiting}", flush=True)
                  if time.monotonic() >= deadline:
                      return False
                  time.sleep(POLL_SECONDS)


          # ---- output ----------------------------------------------------------------------------------------------------

          def _step_summary(unsettled):
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if not path:
                  return
              lines = ["### Review threads", ""]
              if unsettled:
                  for url, reason in unsettled:
                      link = f"[{url}]({url})" if url else "(no url)"
                      lines.append(f"- {link}: {reason}")
              else:
                  lines.append("Every open review thread is resolved or settled.")
              with open(path, "a") as f:
                  f.write("\n".join(lines) + "\n")


          def main(argv=None):
              ap = argparse.ArgumentParser(description="Pass when every open, non-outdated review thread is resolved or settled.")
              ap.add_argument("--repo", default="", help="owner/name")
              ap.add_argument("--pr", default="", help="pull request number (empty outside a pull request event)")
              ap.add_argument("--head", default="", help="head commit sha")
              ap.add_argument("--wait-for", default="PR review", help='name of the review workflow to wait for ("" = do not wait)')
              ap.add_argument("--wait-minutes", type=float, default=20)
              ap.add_argument("--own-run-id", default="", help="this run's id, so it does not wait for itself")
              ap.add_argument("--threads-file", help="offline: JSON list of thread nodes (with --comments-file; no network)")
              ap.add_argument("--comments-file", help="offline: JSON list of issue comments (with --threads-file)")
              args = ap.parse_args(argv)
              if not args.pr or not args.head:
                  print("not a pull request event")
                  return 2
              if bool(args.threads_file) != bool(args.comments_file):
                  print("error: --threads-file and --comments-file go together")
                  return 2
              try:
                  if args.threads_file:
                      threads = json.loads(Path(args.threads_file).read_text())
                      comments = json.loads(Path(args.comments_file).read_text())
                  else:
                      if not args.repo:
                          raise RuntimeError("--repo is required")
                      if not wait_for_review(args.repo, args.head, args.wait_for, args.own_run_id, args.wait_minutes):
                          print("the review run is still running; re-run this check when it ends")
                          return 1
                      threads = fetch_threads(args.repo, args.pr)
                      comments = fetch_issue_comments(args.repo, args.pr)
              except Exception as e:  # any failure fails the check; it never passes
                  print(f"error: {e}")
                  return 2
              reviewed = reviewed_sha(comments)
              unsettled = evaluate(threads, args.head, reviewed)
              for url, reason in unsettled:
                  print(f"UNSETTLED {url or '(no url)'}: {reason}")
              if unsettled:
                  print(f"{len(unsettled)} open thread(s) not settled")
              else:
                  print("every open review thread is resolved or settled "
                        f"({settled_count(threads, args.head, reviewed)} settled by the review's reply)")
              _step_summary(unsettled)
              return 1 if unsettled else 0


          if __name__ == "__main__":
              sys.exit(main())
          TS_EOF
          python3 "$RUNNER_TEMP/threads_settled.py" --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --head "$HEAD_SHA" \
            --wait-for "$REVIEW_WORKFLOW" --wait-minutes "$WAIT_MINUTES" --own-run-id "$GITHUB_RUN_ID"
