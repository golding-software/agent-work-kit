            sleep $(( attempt * 15 + RANDOM % 10 ))
          done
          if ! gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pr.diff" 2> "$RUNNER_TEMP/pr.diff.err"; then
